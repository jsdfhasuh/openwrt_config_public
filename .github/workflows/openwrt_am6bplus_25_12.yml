name: AM6B Plus - Build ARM64 rootfs 25.12.5

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: 'Parallel compiler jobs (2 is safer on hosted runners)'
        type: choice
        required: true
        default: '2'
        options:
          - '1'
          - '2'
          - '4'

  push:
    branches: [main]
    paths:
      - '.github/workflows/openwrt_am6bplus_25_12.yml'
      - 'configs/am6bplus/**'
      - 'scripts/am6bplus/prepare-source.py'
      - 'scripts/am6bplus/verify-config.py'
      - 'scripts/am6bplus/build-artifact.py'

permissions:
  contents: read

concurrency:
  group: am6bplus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-am6bplus]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_DIR: ${{ github.workspace }}/.am6bplus-openwrt
      OUTPUT_DIR: ${{ github.workspace }}/am6bplus-output
      BUILD_JOBS: ${{ inputs.build_jobs || '2' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check build inputs and available space
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR/logs"
          case "$BUILD_JOBS" in 1|2|4) ;; *) exit 1 ;; esac
          git rev-parse HEAD > "$OUTPUT_DIR/configuration-commit.txt"
          cp configs/am6bplus/sources.lock.json "$OUTPUT_DIR/"
          df -h > "$OUTPUT_DIR/logs/disk-before.txt"
          free_gib=$(df --output=avail -BG "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          (( free_gib >= 25 )) || { echo 'Need at least 25 GiB free space; no global runner cleanup is performed.'; exit 1; }
      - name: Install build and packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates xz-utils zstd \
            patch perl time squashfs-tools device-tree-compiler dosfstools e2fsprogs \
            util-linux parted fdisk mtools kmod gzip tar
      - name: Fetch locked sources and verify all requested packages
        run: |
          set -euo pipefail
          python3 scripts/am6bplus/prepare-source.py "$BUILD_DIR" \
            2>&1 | tee "$OUTPUT_DIR/logs/prepare.log"
          cp "$BUILD_DIR/.config" "$OUTPUT_DIR/openwrt.config"
          cp "$BUILD_DIR/am6bplus-source-manifest.json" "$OUTPUT_DIR/"
      - name: Download OpenWrt package sources
        run: |
          set -euo pipefail
          make -C "$BUILD_DIR" download -j"$BUILD_JOBS" V=s 2>&1 | tee "$OUTPUT_DIR/logs/download.log"
      - name: Build once with full log (no automatic retry)
        run: |
          set -euo pipefail
          make -C "$BUILD_DIR" -j"$BUILD_JOBS" world V=s 2>&1 | tee "$OUTPUT_DIR/logs/build.log"
          python3 scripts/am6bplus/verify-config.py "$BUILD_DIR/.config"
          cp "$BUILD_DIR/.config" "$OUTPUT_DIR/openwrt.config"
          python3 scripts/am6bplus/build-artifact.py create "$BUILD_DIR" "$OUTPUT_DIR"
      - name: Record outcome and checksums
        if: always()
        env:
          BUILD_OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          printf 'Workflow outcome: %s\nHardware boot/network/Docker validation: NOT_RUN\n' "$BUILD_OUTCOME" > "$OUTPUT_DIR/STATUS.txt"
          if [[ -f "$BUILD_DIR/.config" ]]; then cp "$BUILD_DIR/.config" "$OUTPUT_DIR/openwrt.config"; fi
          if [[ -d "$BUILD_DIR/logs" ]]; then cp -a "$BUILD_DIR/logs" "$OUTPUT_DIR/openwrt-logs"; fi
          cd "$OUTPUT_DIR"
          checksum_file=$(mktemp "$RUNNER_TEMP/am6bplus-checksums.XXXXXXXX")
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$checksum_file"
          mv "$checksum_file" SHA256SUMS
      - name: Preserve exact-run rootfs, configuration, manifests and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: am6bplus-rootfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: am6bplus-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
